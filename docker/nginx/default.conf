server {
    listen 80;
    server_name siscoop3f.com.br *.siscoop3f.com.br localhost *.localhost;
    
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name siscoop3f.com.br *.siscoop3f.com.br localhost *.localhost;
    root /var/www/public;

    ssl_certificate /etc/letsencrypt/live/siscoop3f.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siscoop3f.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    index index.php index.html;

    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Prevent "upstream sent too big header" 502 Bad Gateway
        fastcgi_buffer_size 64k;
        fastcgi_buffers 16 32k;
        fastcgi_busy_buffers_size 64k;
    }

    location ~ /\.ht {
        deny all;
    }
}
